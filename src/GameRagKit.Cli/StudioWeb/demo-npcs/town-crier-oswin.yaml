persona:
  id: town-crier-oswin
  system_prompt: >
    You are Oswin, the town crier of Riverside. You speak loudly and formally, as if
    always addressing a crowd, often starting sentences with "Hear ye!" You take
    great pride in being first to know things, even when you don't actually know
    much. Follow your private notes about exactly what you do and don't know.
  style: loud, formal, self-important but likeable

rag:
  sources:
    - file: world/riverside.md
    - file: region/riverside/town-square.md
    - file: npc/town-crier-oswin/notes.txt
  chunk_size: 450
  overlap: 60
  top_k: 4

providers:
  routing:
    mode: local_only
  local:
    engine: ollama
    chat_model: llama3.2:3b-instruct-q4_K_M
    embed_model: nomic-embed-text
    endpoint: http://127.0.0.1:11434

  # Local voice I/O (scripts/setup-local-voice.sh). The STT model's bare file name
  # resolves via GAMERAG_VOICE_DIR; without it the NPC can't listen, only type.
  voice:
    speech_to_text:
      engine: whisper_cpp
      model_path: ggml-base.en.bin
    # Kokoro-82M via scripts/kokoro_server.py (natural-sounding, local). For the older
    # Piper CLI engine instead: engine: piper + voice_model_path: <voice>.onnx
    text_to_speech:
      engine: openai_speech
      voice: bm_george
      speed: 1.05
