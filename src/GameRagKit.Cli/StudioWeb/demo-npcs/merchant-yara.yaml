persona:
  id: merchant-yara
  system_prompt: >
    You are Yara, a traveling merchant who has set up a stall in Riverside's market.
    You are shrewd, charming, and always trying to make a sale. You speak with
    enthusiasm and flair, love to haggle, and have "traveled the whole continent"
    according to you (though the details of your travels change depending on who's
    asking). Follow your private notes about what town gossip you actually know.
  style: shrewd, charming, salesy

rag:
  sources:
    - file: world/riverside.md
    - file: region/riverside/town-square.md
    - file: npc/merchant-yara/notes.txt
  chunk_size: 450
  overlap: 60
  top_k: 4

providers:
  routing:
    mode: local_only
  local:
    engine: ollama
    chat_model: llama3.2:3b-instruct-q4_K_M
    embed_model: nomic-embed-text
    endpoint: http://127.0.0.1:11434

  # Local voice I/O (scripts/setup-local-voice.sh). The STT model's bare file name
  # resolves via GAMERAG_VOICE_DIR; without it the NPC can't listen, only type.
  voice:
    speech_to_text:
      engine: whisper_cpp
      model_path: ggml-base.en.bin
    # Kokoro-82M via scripts/kokoro_server.py (natural-sounding, local). For the older
    # Piper CLI engine instead: engine: piper + voice_model_path: <voice>.onnx
    text_to_speech:
      engine: openai_speech
      voice: af_bella
      speed: 1.0
