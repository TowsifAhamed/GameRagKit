<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GameRagKit Demo — Metropolis</title>
  <link rel="stylesheet" href="shared/demo-ui.css" />
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="crosshair"></div>

  <div id="hud">
    <div class="title">Metropolis — <span id="crowd-count"></span> talkable figures, <span id="roster-count"></span> shared backend NPCs</div>
    Click to look around &middot; WASD to move &middot; E to talk to a highlighted figure &middot; Esc to leave dialogue
  </div>

  <div id="interact-prompt" hidden></div>

  <div id="dialogue-panel" hidden>
    <div id="dialogue-npc-name"></div>
    <div id="dialogue-log"></div>
    <form id="dialogue-form">
      <input id="dialogue-input" type="text" placeholder="Say something..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
    <div id="dialogue-hint">Esc to end conversation</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <!-- Real navmesh pathfinding for the crowd (replaces the old hand-rolled point-graph
       waypoint hopping in game-engine.js -- see addCrowd/buildStreetPathfinder there).
       Pinned to the exact 1.3.0 UMD build, not @latest: the plain "three-pathfinding.min.js"
       dist file is CommonJS-only (`require("three")` at module scope) and throws
       "require is not defined" if loaded via a bare <script> tag with no bundler/shim --
       verified by inspecting the actual published dist/ files in the npm tarball, not
       guessed from the package name. dist/three-pathfinding.umd.js is the real browser
       build; its UMD factory attaches itself as window.threePathfinding (confirmed from
       the file's own factory header and from the library's own README UMD example: `const
       Pathfinding = window.threePathfinding.Pathfinding;`), and it expects a global THREE
       (already loaded above) rather than bundling its own copy. -->
  <script src="https://cdn.jsdelivr.net/npm/three-pathfinding@1.3.0/dist/three-pathfinding.umd.js"></script>
  <script src="shared/game-engine.js"></script>
  <script src="shared/dialogue-controller.js"></script>
  <script src="shared/metropolis-roster.js"></script>
  <script>
    // Bundled with Studio: same origin as this page by default (no separate gamerag serve
    // process needed), unless window.GAMERAG_SERVER_URL is set for a different deployment.
    const SERVER_URL = window.GAMERAG_SERVER_URL || "";
    const GROUND_SIZE = 220;
    const CROWD_COUNT = 900;

    // Night-time modern metropolis: cool moonlit ambient/fog plus warm scattered
    // streetlamp point lights, deliberately nothing like either medieval demo's daylight
    // (single-npc.html's warm dawn courtyard or city.html's bright midday square) --
    // reinforces "modern city at night" and is very achievable with primitive/instanced
    // geometry (point lights + emissive-ish warm building windows) without needing any
    // new assets beyond the real building models below.
    const game = GameRagDemo.createGame({
      canvas: document.getElementById("game-canvas"),
      serverUrl: SERVER_URL,
      groundSize: GROUND_SIZE,
      groundColor: 0x14161c,
      skyColor: 0x05070c,
      fogColor: 0x05070c,
      fogNear: 25,
      fogFar: 160,
      ambientColor: 0x5a6a8a,
      ambientIntensity: 0.65,
      sunColor: 0x8fa8d8,
      sunIntensity: 0.5,
      sunPosition: { x: -20, y: 30, z: -15 },
      spawnPosition: { x: 0, y: 0, z: 30 }
    });

    // A simple street grid of city blocks: alternating rows/columns of buildings with
    // gaps as streets, so the crowd and player have somewhere to walk between blocks.
    // Each block loads a real Kenney city-kit-commercial building GLB (see
    // ../../samples/webgl-demo/ASSETS.md) chosen from a small variety pool by grid
    // position, in place of the old flat-colored placeholder box; the box stays as the
    // load-time/failure fallback via addBuilding's built-in placeholder mechanism.
    const blockSize = 14;
    const streetWidth = 8;
    const cell = blockSize + streetWidth;
    const gridExtent = 3; // -3..3 blocks in each direction

    const CITY_MODELS = [
      "assets/city/building-a.glb",
      "assets/city/building-c.glb",
      "assets/city/building-e.glb",
      "assets/city/building-g.glb",
      "assets/city/building-i.glb",
      "assets/city/building-k.glb",
      "assets/city/building-skyscraper-a.glb",
      "assets/city/building-skyscraper-c.glb",
      "assets/city/building-skyscraper-e.glb"
    ];
    const CITY_MODEL_SCALE = 4.2; // world units per 2-unit kit module

    for (let bx = -gridExtent; bx <= gridExtent; bx++) {
      for (let bz = -gridExtent; bz <= gridExtent; bz++) {
        if (bx === 0 && bz === 0) continue; // leave the center block open as a plaza
        const height = 8 + ((Math.abs(bx) + Math.abs(bz)) % 4) * 5;
        const hue = 0.58 + ((bx * 3 + bz * 7) % 10) * 0.01;
        const modelIndex = Math.abs(bx * 7 + bz * 13) % CITY_MODELS.length;
        game.addBuilding({
          position: { x: bx * cell, z: bz * cell },
          width: blockSize,
          depth: blockSize,
          height,
          color: new THREE.Color().setHSL(hue, 0.15, 0.28).getHex(),
          model: CITY_MODELS[modelIndex],
          modelScale: CITY_MODEL_SCALE,
          // Every city-kit model is grounded at local y=0 (verified against each .glb's
          // own position accessor min/max), so no vertical offset is needed.
          modelYOffset: 0
        });
      }
    }

    // Visible road/footpath surface geometry: previously the road/footpath constraint
    // was entirely invisible (same flat groundColor plane everywhere), so a player could
    // only infer where the "street" was from where figures happened to walk. This adds
    // real flat quad meshes -- asphalt-gray road lanes down the center of every corridor
    // (plus the open plaza), and a lighter sidewalk-gray footpath strip on both sides of
    // each corridor (plus a ring around the plaza).
    //
    // The footpath strip sits INSIDE the corridor, adjacent to the building edge, not
    // added on top of the full street half-width -- streetHalfWidth (the corridor's own
    // half-width) already reaches exactly to the building edge (cell/2 - blockSize/2, by
    // construction of the grid), with zero room left over, so a footpath drawn "outside"
    // streetHalfWidth used to render on top of/inside the building, and its road+footpath
    // quads have since diverged from each other since only game-engine.js's actual
    // walkable navmesh got this same fix applied earlier -- this brings the VISIBLE
    // surface back in sync with where figures can really walk. footpathInnerHalf marks
    // where the (now narrower) road band ends and the footpath band begins.
    const FOOTPATH_WIDTH = 1.6;
    const ROAD_SURFACE_Y = 0.02;
    const FOOTPATH_SURFACE_Y = 0.025; // a hair above the road surface so any edge overlap
                                       // has a deterministic winner instead of z-fighting
    const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x33363f });
    const footpathMaterial = new THREE.MeshStandardMaterial({ color: 0x6a6f7c });

    function addSurfaceQuad(material, y, minX, maxX, minZ, maxZ) {
      const width = maxX - minX;
      const depth = maxZ - minZ;
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width, depth), material);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set((minX + maxX) / 2, y, (minZ + maxZ) / 2);
      game.scene.add(mesh);
    }

    const surfaceReach = gridExtent * cell + blockSize / 2 + streetWidth;
    const streetHalfWidth = streetWidth / 2;
    const footpathInnerHalf = Math.max(0, streetHalfWidth - FOOTPATH_WIDTH);
    for (let k = -gridExtent; k < gridExtent; k++) {
      const corridorCenter = (k + 0.5) * cell;
      addSurfaceQuad(roadMaterial, ROAD_SURFACE_Y, corridorCenter - footpathInnerHalf, corridorCenter + footpathInnerHalf, -surfaceReach, surfaceReach);
      addSurfaceQuad(footpathMaterial, FOOTPATH_SURFACE_Y, corridorCenter - streetHalfWidth, corridorCenter - footpathInnerHalf, -surfaceReach, surfaceReach);
      addSurfaceQuad(footpathMaterial, FOOTPATH_SURFACE_Y, corridorCenter + footpathInnerHalf, corridorCenter + streetHalfWidth, -surfaceReach, surfaceReach);
      addSurfaceQuad(roadMaterial, ROAD_SURFACE_Y, -surfaceReach, surfaceReach, corridorCenter - footpathInnerHalf, corridorCenter + footpathInnerHalf);
      addSurfaceQuad(footpathMaterial, FOOTPATH_SURFACE_Y, -surfaceReach, surfaceReach, corridorCenter - streetHalfWidth, corridorCenter - footpathInnerHalf);
      addSurfaceQuad(footpathMaterial, FOOTPATH_SURFACE_Y, -surfaceReach, surfaceReach, corridorCenter + footpathInnerHalf, corridorCenter + streetHalfWidth);
    }
    const plazaHalf = blockSize / 2;
    addSurfaceQuad(roadMaterial, ROAD_SURFACE_Y, -plazaHalf, plazaHalf, -plazaHalf, plazaHalf);
    const plazaOuter = plazaHalf + FOOTPATH_WIDTH;
    addSurfaceQuad(footpathMaterial, FOOTPATH_SURFACE_Y, -plazaOuter, plazaOuter, -plazaOuter, -plazaHalf);
    addSurfaceQuad(footpathMaterial, FOOTPATH_SURFACE_Y, -plazaOuter, plazaOuter, plazaHalf, plazaOuter);
    addSurfaceQuad(footpathMaterial, FOOTPATH_SURFACE_Y, -plazaOuter, -plazaHalf, -plazaHalf, plazaHalf);
    addSurfaceQuad(footpathMaterial, FOOTPATH_SURFACE_Y, plazaHalf, plazaOuter, -plazaHalf, plazaHalf);

    // Scattered warm streetlamps across the plaza and inner ring of blocks -- point
    // lights are cheap and read strongly as "city at night" against the cool ambient/fog
    // set above, without needing any new geometry.
    const lampPositions = [
      { x: 0, z: 30 }, { x: 0, z: 20 },
      { x: 0, z: 10 }, { x: 0, z: -10 }, { x: 10, z: 0 }, { x: -10, z: 0 },
      { x: cell, z: cell }, { x: -cell, z: cell }, { x: cell, z: -cell }, { x: -cell, z: -cell },
      { x: 0, z: cell * 2 }, { x: 0, z: -cell * 2 }, { x: cell * 2, z: 0 }, { x: -cell * 2, z: 0 }
    ];
    lampPositions.forEach((p) => {
      game.addPointLight({ position: { x: p.x, y: 4, z: p.z }, color: 0xffb877, intensity: 1.6, distance: 22, decay: 2 });
    });

    // The cluster/archetype pattern: a small, bounded set of real backend NPCs (see
    // scripts/generate-metropolis-npcs.js, roster.length of them -- one per profession),
    // shared across every crowd figure. Every figure below is individually talkable, but
    // each is tagged with one of these archetype ids at spawn, so talking to any of the
    // CROWD_COUNT figures fans in to just roster.length real NpcAgents -- the backend load
    // (LLM calls, embeddings, memory) stays fixed no matter how large the crowd gets.
    const roster = window.GAMERAG_METROPOLIS_ROSTER || [];

    // A movement constraint per archetype matched to how that role would actually move
    // through a real city, not one shared free-roam behavior for everyone:
    //  - stall-bound vendors ("stationary" + territoryRadius): wander only within a
    //    small radius of their own stall/stand, never leaving their spot.
    //  - street-musician ("stationary", no stall prop): same idea as a vendor -- stays
    //    put on its patch of footpath, but performing rather than selling, so it gets no
    //    stall prop even though the constraint is identical.
    //  - security-guard / city-maintenance-worker ("patrol"): a short fixed beat back
    //    and forth, matching a guard's actual patrol route.
    //  - bike-courier ("fixed-route" + "bike" prop): always retraces the same loop of
    //    street-grid waypoints, like a courier running a regular round.
    //  - delivery-courier ("random-route" + "bike" prop): a fresh random destination
    //    each trip, but always via the street grid -- never cuts across open ground.
    //  - ordinary pedestrians (tourist, office worker, retired teacher, taxi dispatcher
    //    who isn't actually driving): "footpath" -- confined to the sidewalk strip along
    //    a street edge, not wandering into the road lane a vehicle/courier would use.
    // Colors are chosen per-role (a security guard reads as a guard, not a random
    // palette pick) rather than cycling through an unrelated fixed color list.
    // Every archetype gets its OWN distinguishing prop, not a shared generic stand --
    // propKit names a set of parts from game-engine.js's PROP_KITS catalog (a food cart
    // looks different from a newsstand looks different from a coffee cart, etc), while
    // `prop` stays reserved for the two hand-built special-case props (stall/bike) that
    // predate the general propKit system and have their own dedicated meshes/movement
    // integration (delivery-courier is the one archetype using both: "bike" to ride, plus
    // a "delivery-basket" propKit riding along on the back of it).
    const ARCHETYPE_CONFIG = {
      "street-food-vendor": { behavior: "stationary", propKit: "food-cart", color: 0xd4453a, territoryRadius: 1.2 },
      "newsstand-owner": { behavior: "stationary", propKit: "newsstand", color: 0x3a8ad4, territoryRadius: 1.0 },
      "barista": { behavior: "stationary", propKit: "coffee-cart", color: 0x6a4a3a, territoryRadius: 1.0 },
      "shop-owner": { behavior: "stationary", propKit: "shop-sign", color: 0xd4a53a, territoryRadius: 1.4 },
      "food-truck-chef": { behavior: "stationary", propKit: "food-truck", color: 0xe8e8e8, territoryRadius: 1.4 },
      "street-musician": { behavior: "stationary", propKit: "instrument-case", color: 0x8a4ad4, territoryRadius: 0.6 },
      "security-guard": { behavior: "patrol", propKit: "guard-booth", color: 0x1a2a4a },
      "city-maintenance-worker": { behavior: "patrol", propKit: "maintenance-cart", color: 0xd4c23a },
      "bike-courier": { behavior: "fixed-route", prop: "bike", color: 0x3ad46a },
      "delivery-courier": { behavior: "random-route", prop: "bike", propKit: "delivery-basket", color: 0xd4823a },
      // taxi-dispatcher and office-worker-on-a-lunch-break are both roles that actually
      // stand/sit in one spot rather than pace a sidewalk -- a dispatcher works from a
      // fixed taxi stand (complete with a parked taxi), someone on a lunch break sits or
      // stands somewhere, they don't wander. Only tourist (genuinely exploring) and
      // retired-teacher (literally "out for a walk") are actual foot traffic.
      "taxi-dispatcher": { behavior: "stationary", propKit: "taxi-stand", color: 0xe8c840, territoryRadius: 1.0 },
      "tourist": { behavior: "footpath", propKit: "backpack", color: 0xd45ac2 },
      "office-worker-on-a-lunch-break": { behavior: "stationary", propKit: "bench", color: 0x5a6a8a, territoryRadius: 1.0 },
      "retired-teacher-out-for-a-walk": { behavior: "footpath", propKit: "cane", color: 0x8a8a6a }
    };

    const archetypes = roster.map((entry) => {
      const config = ARCHETYPE_CONFIG[entry.id] || { behavior: "footpath", color: 0x9aa0ac };
      return {
        id: entry.id,
        label: entry.role,
        greeting: "Oh, hey there.",
        color: config.color,
        behavior: config.behavior,
        prop: config.prop || null,
        propKit: config.propKit || null,
        territoryRadius: config.territoryRadius
      };
    });

    game.addCrowd({
      count: CROWD_COUNT,
      bounds: { minX: -GROUND_SIZE / 2 + 4, maxX: GROUND_SIZE / 2 - 4, minZ: -GROUND_SIZE / 2 + 4, maxZ: GROUND_SIZE / 2 - 4 },
      roadGrid: { cell, gridExtent, blockSize, streetHalfWidth: streetWidth / 2, footpathWidth: FOOTPATH_WIDTH },
      colors: archetypes.length > 0 ? archetypes.map((a) => a.color) : undefined,
      archetypes
    });

    document.getElementById("crowd-count").textContent = CROWD_COUNT;
    document.getElementById("roster-count").textContent = roster.length;

    GameRagDemo.attachDialogueController(game);
  </script>
</body>
</html>
