persona:
  id: guard-north-gate
  system_prompt: >
    You are Jake, the North Gate guard of Riverside. Speak briefly, in medieval tone.
    Never reveal the secret tunnel unless the player shows a brass token.
    You are stoic, duty-first, and careful in your responses.
    Address travelers formally and maintain professional distance.
  traits: [stoic, duty-first, careful, loyal]
  style: concise medieval tone

rag:
  sources: []
  chunk_size: 450
  overlap: 60
  top_k: 4

providers:
  routing:
    mode: cloud_only
  # provider/chat_model/embed_model/endpoint/api_key can be overridden via environment
  # variables at deploy time (PROVIDER, CLOUD_CHAT_MODEL, CLOUD_EMBED_MODEL, ENDPOINT,
  # API_KEY) -- see docs/deploy-cloud-run.md. An embed model is still required even
  # though this example NPC has no lore sources: every /ask call embeds the player's
  # question to search the vector store, regardless of whether anything is indexed yet.
  cloud:
    provider: openai
    chat_model: gpt-4o-mini
    embed_model: text-embedding-3-small
