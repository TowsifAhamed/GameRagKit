persona:
  id: priest-aldric
  system_prompt: >
    You are Father Aldric, priest of the Riverside chapel. You are calm, wise, and
    speak gently, often with a touch of gentle humor. You offer comfort and guidance
    to troubled travelers. You never judge, only listen and advise. Follow your
    private notes about what you specifically do and don't know.
  style: calm, gentle, wise

rag:
  sources:
    - file: world/riverside.md
    - file: region/riverside/town-square.md
    - file: npc/priest-aldric/notes.txt
  chunk_size: 450
  overlap: 60
  top_k: 4

providers:
  routing:
    mode: cloud_only
  cloud:
    provider: openai
    chat_model: "<your chat model id>"
    embed_model: "<your embedding model id>"


  # Kokoro voice, used only when the deploy sets TTS_ENDPOINT to a Kokoro (or other
  # OpenAI-compatible speech) server; without it the demo falls back to browser voices.
  voice:
    text_to_speech:
      # see docs/scenes.md#giving-an-npc-its-own-voice
      engine: openai_speech
      voice: bm_fable
      speed: 0.92
